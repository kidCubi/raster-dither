<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raster Dither</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="masthead">
      <!-- Logo: a 5×5 dot matrix dithering from light (left) to solid ink (right). -->
      <svg class="mark" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
        <g class="off">
          <circle cx="2" cy="2" r="1.1" /><circle cx="10" cy="2" r="1.1" />
          <circle cx="2" cy="6" r="1.1" /><circle cx="6" cy="6" r="1.1" />
          <circle cx="6" cy="10" r="1.1" /><circle cx="14" cy="10" r="1.1" />
          <circle cx="2" cy="14" r="1.1" /><circle cx="10" cy="14" r="1.1" />
          <circle cx="2" cy="18" r="1.1" /><circle cx="6" cy="18" r="1.1" />
        </g>
        <g class="on">
          <circle cx="6" cy="2" r="1.5" /><circle cx="14" cy="2" r="1.5" /><circle cx="18" cy="2" r="1.5" />
          <circle cx="10" cy="6" r="1.5" /><circle cx="14" cy="6" r="1.5" /><circle cx="18" cy="6" r="1.5" />
          <circle cx="2" cy="10" r="1.5" /><circle cx="10" cy="10" r="1.5" /><circle cx="18" cy="10" r="1.5" />
          <circle cx="6" cy="14" r="1.5" /><circle cx="14" cy="14" r="1.5" /><circle cx="18" cy="14" r="1.5" />
          <circle cx="10" cy="18" r="1.5" /><circle cx="14" cy="18" r="1.5" /><circle cx="18" cy="18" r="1.5" />
        </g>
      </svg>
      <span class="wordmark">Raster Dither</span>
      <span class="meta">RD—01 · 1-bit image processor</span>
    </header>

    <main id="stage">
      <div id="frame" hidden>
        <span id="frame-tag">Output</span>
        <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
        <canvas id="out"></canvas>
        <canvas id="orig" hidden></canvas>
        <div id="crop" hidden>
          <div class="crop-box">
            <span class="h" data-h="nw"></span><span class="h" data-h="n"></span><span class="h" data-h="ne"></span>
            <span class="h" data-h="w"></span><span class="h" data-h="e"></span>
            <span class="h" data-h="sw"></span><span class="h" data-h="s"></span><span class="h" data-h="se"></span>
          </div>
        </div>
      </div>
    </main>

    <div id="empty">
      <div class="intro">
        <p class="eyebrow">RD—01</p>
        <h1>Raster Dither</h1>
        <p class="lede">Turns a picture into ink and paper, with one to three inks.</p>
        <ol class="steps">
          <li><span>01</span>Load an image</li>
          <li><span>02</span>Adjust the parameters</li>
          <li><span>03</span>Export PNG or SVG</li>
        </ol>
        <div class="actions">
          <button id="btn-open" type="button">Load image</button>
          <button id="btn-sample" type="button" class="secondary">Use sample</button>
        </div>
        <p class="hint">Or drop / paste an image anywhere.</p>
      </div>
    </div>

    <footer id="status">
      <span id="status-state" data-state="idle">Standby</span>
      <span id="status-text"></span>
      <span class="keys"><kbd>Space</kbd> compare <kbd>⌘S</kbd> export <kbd>⌘O</kbd> open</span>
    </footer>

    <input type="file" id="file" accept="image/*" hidden />
    <input type="file" id="preset-file" accept="application/json,.json" hidden />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
